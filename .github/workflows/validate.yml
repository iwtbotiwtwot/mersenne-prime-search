name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exact-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository structure
        run: python3 verification/validate_repository.py
      - name: Run exact regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Produce a reference receipt
        run: python3 src/mersenne_search.py 31
